<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#193A28" />
    <meta
      name="description"
      content="GENTLEMAN is a Nairobi house of craft for the modern man — suits, shirts and footwear cut, sewn, and hand-finished for considered, lasting wear."
    />
    <!-- Static site-wide unfurl card for WhatsApp/Facebook link previews.
         Per-product images aren't possible here: those crawlers fetch raw
         HTML and never run the client bundle, so a route only CRA can't
         serve a different og:image per product without a prerender or
         edge-function step, which is outside this stack. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GENTLEMAN" />
    <meta property="og:title" content="GENTLEMAN — Tailored menswear, Nairobi" />
    <meta
      property="og:description"
      content="Shirts, suits and footwear cut for the modern man. Pick your size, send your order on WhatsApp, and pay only when it's in your hands."
    />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GENTLEMAN — Tailored menswear, Nairobi" />
    <meta
      name="twitter:description"
      content="Shirts, suits and footwear cut for the modern man. Order on WhatsApp, pay on delivery."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload + swap-in so the fonts stylesheet never blocks first paint;
         the stylesheet's own &display=swap still avoids invisible text
         while the webfont itself loads. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;0,6..96,800;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;0,6..96,800;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500;600&display=swap"
      />
    </noscript>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>GENTLEMAN</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
